spring.application.name=leaguecamp

# Banco de dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/LeagueCamp
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA}

# Criação das tabelas e dados de exemplo ao iniciar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# Desenvolvimento
spring.thymeleaf.cache=false
server.port=8080
